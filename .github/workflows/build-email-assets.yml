name: Build email image sections
on:
  push:
    paths:
      - "email_slices.py"
      - "siripay_4k.png"
      - ".github/workflows/build-email-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python email_slices.py
      - name: Publish image slices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email-assets/
          if ! git diff --staged --quiet; then
            git commit -m "Publish SiriPay inline email image slices"
            git push
          fi
